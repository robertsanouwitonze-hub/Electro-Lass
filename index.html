<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Electro-LASS Digital Library</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --electro-blue: #07178c;
            --electric-orange: #ff7200;
            --neon-green: #00ffcc;
            --spark-purple: #9d00ff;
            --dark-bg: #0a0f2e;
            --text-light: #ffffff;
            --text-gray: #aaaaaa;
            --border-radius: 12px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            background: var(--dark-bg);
            color: var(--text-light);
            min-height: 100vh;
        }

        /* Header */
        .main-header {
            background: rgba(10, 15, 46, 0.95);
            padding: 1rem 2rem;
            border-bottom: 2px solid var(--electric-orange);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .nav-container {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--neon-green);
            text-decoration: none;
        }

        .main-nav {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .nav-link {
            padding: 10px 20px;
            border-radius: 30px;
            text-decoration: none;
            color: var(--text-gray);
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
        }

        .nav-link:hover, .nav-link.active {
            background: linear-gradient(135deg, var(--electric-orange), var(--spark-purple));
            color: white;
        }

        .user-panel {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: rgba(0, 255, 204, 0.1);
            border-radius: 50px;
            border: 1px solid rgba(0, 255, 204, 0.3);
        }

        .badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .admin-badge {
            background: linear-gradient(135deg, #ff3860, var(--electric-orange));
            color: white;
        }

        .author-badge {
            background: linear-gradient(135deg, var(--spark-purple), var(--neon-green));
            color: white;
        }

        .premium-badge {
            background: linear-gradient(135deg, #ffc107, var(--electric-orange));
            color: var(--dark-bg);
            font-weight: bold;
        }

        .btn {
            padding: 10px 20px;
            border-radius: 8px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--electric-orange), var(--spark-purple));
            color: white;
        }

        .btn-logout {
            background: rgba(255, 56, 96, 0.1);
            color: #ff3860;
            border: 1px solid rgba(255, 56, 96, 0.3);
        }

        /* Page Container */
        #pageContainer {
            padding: 2rem;
            max-width: 1400px;
            margin: 0 auto;
            min-height: calc(100vh - 120px);
        }

        .page-header {
            text-align: center;
            margin-bottom: 2rem;
            padding: 2rem;
            background: linear-gradient(135deg, rgba(7, 23, 140, 0.3), rgba(255, 114, 0, 0.15));
            border-radius: var(--border-radius);
            border: 1px solid rgba(0, 255, 204, 0.2);
        }

        .page-header h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            background: linear-gradient(45deg, var(--electric-orange), var(--neon-green));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        /* Books Grid */
        .books-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 2rem;
            margin-top: 2rem;
        }

        .book-card {
            background: linear-gradient(145deg, rgba(7, 23, 140, 0.3), rgba(157, 0, 255, 0.2));
            padding: 1.5rem;
            border-radius: var(--border-radius);
            border: 1px solid rgba(0, 255, 204, 0.2);
            transition: all 0.3s ease;
        }

        .book-card:hover {
            transform: translateY(-5px);
            border-color: var(--neon-green);
            box-shadow: 0 10px 20px rgba(0, 255, 204, 0.2);
        }

        .book-title {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: white;
        }

        .book-author {
            color: var(--neon-green);
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .book-category {
            display: inline-block;
            background: rgba(0, 255, 204, 0.1);
            color: var(--neon-green);
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 0.8rem;
            margin-bottom: 1rem;
        }

        .book-description {
            color: var(--text-gray);
            font-size: 0.9rem;
            line-height: 1.4;
            margin: 1rem 0;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .book-meta {
            display: flex;
            justify-content: space-between;
            color: var(--text-gray);
            font-size: 0.8rem;
            margin-top: 1rem;
        }

        .book-actions {
            display: flex;
            gap: 10px;
            margin-top: 1rem;
        }

        .action-btn {
            flex: 1;
            padding: 8px 12px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .read-btn {
            background: #ff3860;
            color: white;
        }

        .like-btn {
            background: rgba(255, 114, 0, 0.2);
            color: var(--electric-orange);
            border: 1px solid rgba(255, 114, 0, 0.3);
        }

        .like-btn.liked {
            background: #ff3860;
            color: white;
            border-color: #ff3860;
        }

        /* Search */
        .search-section {
            margin: 2rem 0;
            padding: 1.5rem;
            background: linear-gradient(135deg, rgba(7, 23, 140, 0.3), rgba(157, 0, 255, 0.2));
            border-radius: var(--border-radius);
            border: 1px solid rgba(0, 255, 204, 0.2);
        }

        .search-container {
            position: relative;
            margin-bottom: 1rem;
        }

        .search-box {
            width: 100%;
            padding: 1rem 1.5rem 1rem 3.5rem;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid var(--neon-green);
            border-radius: 50px;
            color: var(--text-light);
            font-size: 1.1rem;
            outline: none;
        }

        .search-icon {
            position: absolute;
            left: 1.5rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--neon-green);
            font-size: 1.2rem;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: var(--dark-bg);
            border-radius: var(--border-radius);
            border: 2px solid var(--electric-orange);
            width: 90%;
            max-width: 500px;
            padding: 2rem;
            position: relative;
        }

        .modal-close {
            position: absolute;
            top: 15px;
            right: 15px;
            background: none;
            border: none;
            color: var(--text-gray);
            font-size: 1.5rem;
            cursor: pointer;
        }

        /* Form */
        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-light);
            font-weight: 600;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px 15px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(0, 255, 204, 0.3);
            border-radius: 8px;
            color: var(--text-light);
            font-size: 1rem;
        }

        /* Alert */
        .alert {
            position: fixed;
            top: 100px;
            right: 2rem;
            padding: 1rem 1.5rem;
            border-radius: 8px;
            z-index: 1001;
            animation: slideInRight 0.3s ease;
            max-width: 400px;
        }

        @keyframes slideInRight {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        .alert-success {
            background: rgba(0, 255, 136, 0.15);
            border: 1px solid #00ff88;
            color: #00ff88;
        }

        .alert-error {
            background: rgba(255, 56, 96, 0.15);
            border: 1px solid #ff3860;
            color: #ff3860;
        }

        /* Stats */
        .stats-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 1.5rem;
            margin: 2rem 0;
        }

        .stat-card {
            background: linear-gradient(135deg, rgba(7, 23, 140, 0.3), rgba(157, 0, 255, 0.2));
            padding: 1.5rem;
            border-radius: var(--border-radius);
            border: 1px solid rgba(0, 255, 204, 0.2);
            text-align: center;
        }

        .stat-number {
            font-size: 2.5rem;
            font-weight: bold;
            color: var(--neon-green);
            margin-bottom: 0.5rem;
        }

        .stat-label {
            font-size: 0.9rem;
            color: var(--text-gray);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .nav-container {
                flex-direction: column;
                text-align: center;
            }
            
            .books-grid {
                grid-template-columns: 1fr;
            }
            
            .page-header h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <header class="main-header">
        <div class="nav-container">
            <a href="#" class="logo" onclick="navigateTo('home'); return false;">
                <i class="fas fa-bolt"></i>
                <span>Electro-LASS</span>
            </a>
            
            <nav class="main-nav" id="mainNav">
                <!-- Navigation will be updated by JavaScript -->
            </nav>
            
            <div class="user-panel">
                <div class="user-info" id="userInfo">
                    <i class="fas fa-user-circle"></i>
                    <span id="userStatus">Guest</span>
                </div>
                <button class="btn btn-logout" onclick="logout()" id="logoutBtn" style="display: none;">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main id="pageContainer">
        <!-- Pages load here -->
    </main>

    <!-- Login Modal -->
    <div class="modal" id="loginModal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal('loginModal')">&times;</button>
            <h2><i class="fas fa-sign-in-alt"></i> Login</h2>
            
            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="loginEmail" placeholder="Enter your email" required>
                </div>
                
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="loginPassword" placeholder="Enter your password" required>
                </div>
                
                <button type="submit" class="btn btn-primary" style="width: 100%;">
                    <i class="fas fa-sign-in-alt"></i> Login
                </button>
            </form>
            
            <p style="text-align: center; margin-top: 1rem; color: var(--text-gray);">
                Don't have an account? 
                <a href="#" onclick="openSignupModal()" style="color: var(--electric-orange);">
                    Sign up here
                </a>
            </p>
            
            <div style="margin-top: 1.5rem; padding: 1rem; background: rgba(0, 255, 204, 0.1); border-radius: 8px;">
                <h4 style="color: var(--neon-green); margin-bottom: 0.5rem;">Demo Accounts</h4>
                <p style="font-size: 0.9rem; color: var(--text-gray);">
                    <strong>Regular User:</strong> demo@user.com / demo123
                </p>
                <p style="font-size: 0.9rem; color: var(--text-gray);">
                    <strong>Premium User:</strong> premium@user.com / premium123
                </p>
            </div>
        </div>
    </div>

    <!-- Signup Modal -->
    <div class="modal" id="signupModal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal('signupModal')">&times;</button>
            <h2><i class="fas fa-user-plus"></i> Create Account</h2>
            
            <form id="signupForm" onsubmit="handleSignup(event)">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="signupName" placeholder="Enter your full name" required>
                </div>
                
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="signupEmail" placeholder="Enter your email" required>
                </div>
                
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="signupPassword" placeholder="Create a password" required>
                </div>
                
                <button type="submit" class="btn btn-primary" style="width: 100%;">
                    <i class="fas fa-user-plus"></i> Create Account
                </button>
            </form>
            
            <p style="text-align: center; margin-top: 1rem; color: var(--text-gray);">
                Already have an account? 
                <a href="#" onclick="openLoginModal()" style="color: var(--electric-orange);">
                    Login here
                </a>
            </p>
        </div>
    </div>

    <script>
        // ===== SIMPLE LIBRARY SYSTEM =====
        var DigitalLibrary = {
            // Initialize data
            init: function() {
                // Initialize books
                if (!localStorage.getItem('library_books')) {
                    var sampleBooks = [
                        {
                            id: 1,
                            title: "JavaScript: The Definitive Guide",
                            author: "David Flanagan",
                            category: "Programming",
                            description: "Master JavaScript programming with this comprehensive guide",
                            dateAdded: new Date().toISOString(),
                            likesCount: 42,
                            downloadsCount: 156,
                            viewsCount: 456,
                            averageRating: 4.5,
                            pages: 1096,
                            year: 2020
                        },
                        {
                            id: 2,
                            title: "Clean Code: A Handbook of Agile Software Craftsmanship",
                            author: "Robert C. Martin",
                            category: "Programming",
                            description: "Learn to write clean, maintainable code with practical examples",
                            dateAdded: new Date().toISOString(),
                            likesCount: 38,
                            downloadsCount: 89,
                            viewsCount: 234,
                            averageRating: 4.7,
                            pages: 464,
                            year: 2008
                        },
                        {
                            id: 3,
                            title: "The Great Gatsby",
                            author: "F. Scott Fitzgerald",
                            category: "Novel",
                            description: "Classic American novel about the Jazz Age",
                            dateAdded: new Date().toISOString(),
                            likesCount: 51,
                            downloadsCount: 203,
                            viewsCount: 567,
                            averageRating: 4.8,
                            pages: 180,
                            year: 1925
                        }
                    ];
                    localStorage.setItem('library_books', JSON.stringify(sampleBooks));
                }
                
                // Initialize users
                if (!localStorage.getItem('library_users')) {
                    var sampleUsers = [
                        {
                            id: 'demo_user_001',
                            name: "Demo User",
                            email: "demo@user.com",
                            password: "demo123",
                            role: "user",
                            subscription: "free",
                            likedBooks: []
                        },
                        {
                            id: 'premium_user_001',
                            name: "Premium User",
                            email: "premium@user.com",
                            password: "premium123",
                            role: "user",
                            subscription: "premium",
                            likedBooks: []
                        }
                    ];
                    localStorage.setItem('library_users', JSON.stringify(sampleUsers));
                }
                
                // Initialize likes
                if (!localStorage.getItem('library_likes')) {
                    localStorage.setItem('library_likes', JSON.stringify([]));
                }
                
                console.log('Digital Library initialized');
            },
            
            // Get all books
            getBooks: function() {
                return JSON.parse(localStorage.getItem('library_books') || '[]');
            },
            
            // Get a single book
            getBook: function(id) {
                var books = this.getBooks();
                for (var i = 0; i < books.length; i++) {
                    if (books[i].id == id) {
                        return books[i];
                    }
                }
                return null;
            },
            
            // Save a book
            saveBook: function(book) {
                var books = this.getBooks();
                books.push(book);
                localStorage.setItem('library_books', JSON.stringify(books));
            },
            
            // Get all users
            getUsers: function() {
                return JSON.parse(localStorage.getItem('library_users') || '[]');
            },
            
            // Get user by email
            getUserByEmail: function(email) {
                var users = this.getUsers();
                for (var i = 0; i < users.length; i++) {
                    if (users[i].email === email) {
                        return users[i];
                    }
                }
                return null;
            },
            
            // Save user
            saveUser: function(user) {
                var users = this.getUsers();
                var found = false;
                
                for (var i = 0; i < users.length; i++) {
                    if (users[i].email === user.email) {
                        users[i] = user;
                        found = true;
                        break;
                    }
                }
                
                if (!found) {
                    user.id = 'user_' + Date.now();
                    users.push(user);
                }
                
                localStorage.setItem('library_users', JSON.stringify(users));
                return user;
            },
            
            // Check if user has liked a book
            hasUserLikedBook: function(bookId, userId) {
                var likes = JSON.parse(localStorage.getItem('library_likes') || '[]');
                return likes.some(like => like.bookId == bookId && like.userId === userId);
            },
            
            // Toggle like
            toggleLike: function(bookId, userId) {
                var likes = JSON.parse(localStorage.getItem('library_likes') || '[]');
                var existingIndex = likes.findIndex(like => 
                    like.bookId == bookId && like.userId === userId
                );
                
                if (existingIndex >= 0) {
                    // Remove like
                    likes.splice(existingIndex, 1);
                    localStorage.setItem('library_likes', JSON.stringify(likes));
                    return false;
                } else {
                    // Add like
                    likes.push({
                        bookId: bookId,
                        userId: userId,
                        date: new Date().toISOString()
                    });
                    localStorage.setItem('library_likes', JSON.stringify(likes));
                    return true;
                }
            },
            
            // Get likes count for a book
            getLikesCount: function(bookId) {
                var likes = JSON.parse(localStorage.getItem('library_likes') || '[]');
                return likes.filter(like => like.bookId == bookId).length;
            },
            
            // Search books
            searchBooks: function(query) {
                var books = this.getBooks();
                if (!query) return books;
                
                query = query.toLowerCase();
                return books.filter(book => 
                    book.title.toLowerCase().includes(query) ||
                    book.author.toLowerCase().includes(query) ||
                    book.category.toLowerCase().includes(query) ||
                    book.description.toLowerCase().includes(query)
                );
            }
        };

        // ===== GLOBAL VARIABLES =====
        var currentUser = {
            isLoggedIn: false,
            name: "",
            email: "",
            id: "",
            subscription: "free",
            likedBooks: []
        };
        
        var currentPage = 'home';

        // ===== INITIALIZATION =====
        document.addEventListener('DOMContentLoaded', function() {
            console.log('Starting Electro-LASS Digital Library...');
            
            try {
                // Initialize the library
                DigitalLibrary.init();
                
                // Load saved user from localStorage
                var savedUser = localStorage.getItem('currentUser');
                if (savedUser) {
                    var userData = JSON.parse(savedUser);
                    var dbUser = DigitalLibrary.getUserByEmail(userData.email);
                    if (dbUser) {
                        currentUser = {
                            isLoggedIn: true,
                            name: dbUser.name,
                            email: dbUser.email,
                            id: dbUser.id,
                            subscription: dbUser.subscription,
                            likedBooks: dbUser.likedBooks || []
                        };
                    }
                }
                
                // Load initial page
                navigateTo('home');
                
            } catch (error) {
                console.error('Initialization error:', error);
                showAlert('Failed to initialize: ' + error.message, 'error');
            }
        });

        // ===== NAVIGATION =====
        function navigateTo(page) {
            currentPage = page;
            
            // Update URL hash
            window.location.hash = page;
            
            // Update page title
            document.title = page.charAt(0).toUpperCase() + page.slice(1) + ' | Electro-LASS';
            
            // Update navigation
            updateNavigation();
            
            // Load page content
            loadPageContent(page);
        }

        function updateNavigation() {
            var nav = document.getElementById('mainNav');
            var navHTML = '';
            
            navHTML += `
                <a href="#" class="nav-link ${currentPage === 'home' ? 'active' : ''}" onclick="navigateTo('home'); return false;">
                    <i class="fas fa-home"></i> Home
                </a>
                <a href="#" class="nav-link ${currentPage === 'library' ? 'active' : ''}" onclick="navigateTo('library'); return false;">
                    <i class="fas fa-book"></i> Library
                </a>
            `;
            
            if (!currentUser.isLoggedIn) {
                navHTML += `
                    <a href="#" class="nav-link" onclick="openLoginModal(); return false;">
                        <i class="fas fa-sign-in-alt"></i> Login
                    </a>
                `;
            }
            
            nav.innerHTML = navHTML;
            
            // Update user panel
            updateUserPanel();
        }

        function updateUserPanel() {
            var userStatus = document.getElementById('userStatus');
            var logoutBtn = document.getElementById('logoutBtn');
            
            if (currentUser.isLoggedIn) {
                userStatus.textContent = currentUser.name;
                logoutBtn.style.display = 'block';
            } else {
                userStatus.textContent = 'Guest';
                logoutBtn.style.display = 'none';
            }
        }

        // ===== PAGE CONTENT =====
        function loadPageContent(page) {
            var container = document.getElementById('pageContainer');
            
            if (page === 'home') {
                container.innerHTML = getHomePageContent();
            } else if (page === 'library') {
                container.innerHTML = getLibraryPageContent();
                loadBooks();
            } else {
                container.innerHTML = '<div class="alert-error">Page not found</div>';
            }
        }

        function getHomePageContent() {
            var books = DigitalLibrary.getBooks();
            var stats = {
                totalBooks: books.length,
                totalDownloads: books.reduce((sum, book) => sum + (book.downloadsCount || 0), 0),
                totalLikes: books.reduce((sum, book) => sum + (book.likesCount || 0), 0)
            };
            
            return `
                <div class="page-header">
                    <h1>Welcome to Electro-LASS Digital Library</h1>
                    <p style="color: var(--text-gray); max-width: 600px; margin: 0 auto;">
                        Advanced digital library with real file uploads, analytics, and premium features
                    </p>
                </div>
                
                ${!currentUser.isLoggedIn ? `
                    <div style="text-align: center; margin-bottom: 2rem;">
                        <button class="btn btn-primary" onclick="openLoginModal()" style="margin-right: 1rem;">
                            <i class="fas fa-sign-in-alt"></i> Login
                        </button>
                        <button class="btn" onclick="openSignupModal()" style="background: var(--neon-green); color: var(--dark-bg);">
                            <i class="fas fa-user-plus"></i> Sign Up Free
                        </button>
                    </div>
                ` : `
                    <div style="text-align: center; margin-bottom: 2rem;">
                        <h2 style="color: var(--neon-green);">Welcome back, ${currentUser.name}!</h2>
                        <p style="color: var(--text-gray);">${currentUser.subscription === 'premium' ? 'Premium Member' : 'Free Account'}</p>
                    </div>
                `}
                
                <div class="stats-container">
                    <div class="stat-card">
                        <div class="stat-number">${stats.totalBooks}</div>
                        <div class="stat-label">Total Books</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number">${stats.totalDownloads}</div>
                        <div class="stat-label">Total Downloads</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number">${stats.totalLikes}</div>
                        <div class="stat-label">Total Likes</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number">${currentUser.isLoggedIn ? currentUser.subscription : 'Guest'}</div>
                        <div class="stat-label">Your Plan</div>
                    </div>
                </div>
                
                <div style="margin-top: 3rem;">
                    <h2 style="color: var(--neon-green); margin-bottom: 1rem;">Featured Books</h2>
                    <div id="featuredBooks" class="books-grid">
                        <!-- Featured books will load here -->
                    </div>
                </div>
            `;
            
            // Load featured books after page loads
            setTimeout(loadFeaturedBooks, 100);
        }

        function loadFeaturedBooks() {
            var container = document.getElementById('featuredBooks');
            if (!container) return;
            
            var books = DigitalLibrary.getBooks().slice(0, 3); // Get first 3 books
            var html = '';
            
            books.forEach(book => {
                var isLiked = currentUser.isLoggedIn ? 
                    DigitalLibrary.hasUserLikedBook(book.id, currentUser.id) : false;
                
                html += `
                    <div class="book-card">
                        <h3 class="book-title">${book.title}</h3>
                        <div class="book-author">
                            <i class="fas fa-user-pen"></i> ${book.author}
                        </div>
                        <div class="book-category">
                            <i class="fas fa-tag"></i> ${book.category}
                        </div>
                        <div class="book-description">
                            ${book.description}
                        </div>
                        <div class="book-meta">
                            <div>
                                <i class="fas fa-calendar"></i> ${book.year}
                            </div>
                            <div>
                                <i class="fas fa-star" style="color: #ffc107;"></i> ${book.averageRating.toFixed(1)}
                            </div>
                        </div>
                        <div class="book-actions">
                            <button class="action-btn read-btn" onclick="viewBook(${book.id})">
                                <i class="fas fa-book-open"></i> View
                            </button>
                            ${currentUser.isLoggedIn ? `
                                <button class="action-btn like-btn ${isLiked ? 'liked' : ''}" onclick="toggleBookLike(${book.id})">
                                    <i class="fas fa-heart"></i> ${isLiked ? 'Liked' : 'Like'}
                                </button>
                            ` : `
                                <button class="action-btn like-btn" onclick="showLoginRequired()">
                                    <i class="fas fa-heart"></i> Like
                                </button>
                            `}
                        </div>
                    </div>
                `;
            });
            
            container.innerHTML = html;
        }

        function getLibraryPageContent() {
            return `
                <div class="page-header">
                    <h1><i class="fas fa-book-open"></i> Digital Library</h1>
                    <p style="color: var(--text-gray); max-width: 600px; margin: 0 auto;">
                        Browse, search, and read from our collection of books
                    </p>
                </div>
                
                <div class="search-section">
                    <div class="search-container">
                        <div class="search-icon">
                            <i class="fas fa-search"></i>
                        </div>
                        <input type="text" class="search-box" id="mainSearch" 
                               placeholder="Search books by title, author, or category..."
                               oninput="handleSearch()">
                    </div>
                    
                    <div style="display: flex; gap: 1rem; margin-top: 1rem; flex-wrap: wrap;">
                        <button class="btn" onclick="filterByCategory('Programming')">
                            <i class="fas fa-code"></i> Programming
                        </button>
                        <button class="btn" onclick="filterByCategory('Novel')">
                            <i class="fas fa-book"></i> Novels
                        </button>
                        <button class="btn" onclick="filterByCategory('Technology')">
                            <i class="fas fa-microchip"></i> Technology
                        </button>
                    </div>
                </div>
                
                <div id="booksContainer">
                    <!-- Books will load here -->
                </div>
            `;
        }

        function loadBooks() {
            var container = document.getElementById('booksContainer');
            if (!container) return;
            
            var searchInput = document.getElementById('mainSearch');
            var query = searchInput ? searchInput.value : '';
            
            var books = DigitalLibrary.searchBooks(query);
            
            if (books.length === 0) {
                container.innerHTML = `
                    <div style="text-align: center; padding: 4rem; color: var(--text-gray);">
                        <i class="fas fa-book" style="font-size: 3rem; margin-bottom: 1rem;"></i>
                        <h3>No books found</h3>
                        <p>Try different search terms</p>
                    </div>
                `;
                return;
            }
            
            var html = '<div class="books-grid">';
            
            books.forEach(book => {
                var isLiked = currentUser.isLoggedIn ? 
                    DigitalLibrary.hasUserLikedBook(book.id, currentUser.id) : false;
                
                html += `
                    <div class="book-card">
                        <h3 class="book-title">${book.title}</h3>
                        <div class="book-author">
                            <i class="fas fa-user-pen"></i> ${book.author}
                        </div>
                        <div class="book-category">
                            <i class="fas fa-tag"></i> ${book.category}
                        </div>
                        <div class="book-description">
                            ${book.description}
                        </div>
                        <div class="book-meta">
                            <div>
                                <i class="fas fa-calendar"></i> ${book.year}
                            </div>
                            <div>
                                <i class="fas fa-star" style="color: #ffc107;"></i> ${book.averageRating.toFixed(1)}
                            </div>
                        </div>
                        <div class="book-actions">
                            <button class="action-btn read-btn" onclick="viewBook(${book.id})">
                                <i class="fas fa-book-open"></i> View
                            </button>
                            ${currentUser.isLoggedIn ? `
                                <button class="action-btn like-btn ${isLiked ? 'liked' : ''}" onclick="toggleBookLike(${book.id})">
                                    <i class="fas fa-heart"></i> ${isLiked ? 'Liked' : 'Like'}
                                </button>
                            ` : `
                                <button class="action-btn like-btn" onclick="showLoginRequired()">
                                    <i class="fas fa-heart"></i> Like
                                </button>
                            `}
                        </div>
                    </div>
                `;
            });
            
            html += '</div>';
            container.innerHTML = html;
        }

        // ===== BOOK FUNCTIONS =====
        function viewBook(bookId) {
            var book = DigitalLibrary.getBook(bookId);
            if (!book) {
                showAlert('Book not found', 'error');
                return;
            }
            
            // Increment view count
            book.viewsCount = (book.viewsCount || 0) + 1;
            var books = DigitalLibrary.getBooks();
            var updatedBooks = books.map(b => b.id == bookId ? book : b);
            localStorage.setItem('library_books', JSON.stringify(updatedBooks));
            
            // Show book details in an alert for simplicity
            showAlert(`Opening: ${book.title} by ${book.author}`, 'info');
            
            // In a real app, you would open a modal or new page
            console.log('Viewing book:', book);
        }

        function toggleBookLike(bookId) {
            if (!currentUser.isLoggedIn) {
                showLoginRequired();
                return;
            }
            
            var liked = DigitalLibrary.toggleLike(bookId, currentUser.id);
            
            // Update book likes count
            var book = DigitalLibrary.getBook(bookId);
            if (book) {
                if (liked) {
                    book.likesCount = (book.likesCount || 0) + 1;
                } else {
                    book.likesCount = Math.max(0, (book.likesCount || 1) - 1);
                }
                
                var books = DigitalLibrary.getBooks();
                var updatedBooks = books.map(b => b.id == bookId ? book : b);
                localStorage.setItem('library_books', JSON.stringify(updatedBooks));
            }
            
            // Update user's liked books
            var user = DigitalLibrary.getUserByEmail(currentUser.email);
            if (user) {
                if (liked) {
                    user.likedBooks = user.likedBooks || [];
                    if (!user.likedBooks.includes(bookId)) {
                        user.likedBooks.push(bookId);
                    }
                } else {
                    user.likedBooks = (user.likedBooks || []).filter(id => id != bookId);
                }
                DigitalLibrary.saveUser(user);
            }
            
            // Update UI
            if (currentPage === 'library') {
                loadBooks();
            }
            if (currentPage === 'home') {
                loadFeaturedBooks();
            }
            
            showAlert(liked ? 'Book liked!' : 'Book unliked', 'success');
        }

        // ===== SEARCH FUNCTIONS =====
        var searchTimeout;
        function handleSearch() {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(loadBooks, 300);
        }

        function filterByCategory(category) {
            var searchInput = document.getElementById('mainSearch');
            if (searchInput) {
                searchInput.value = category;
                loadBooks();
            }
        }

        // ===== USER AUTHENTICATION =====
        function openLoginModal() {
            closeModal('signupModal');
            document.getElementById('loginModal').style.display = 'flex';
        }

        function openSignupModal() {
            closeModal('loginModal');
            document.getElementById('signupModal').style.display = 'flex';
        }

        function closeModal(modalId) {
            document.getElementById(modalId).style.display = 'none';
        }

        function handleLogin(event) {
            event.preventDefault();
            
            var email = document.getElementById('loginEmail').value.trim();
            var password = document.getElementById('loginPassword').value;
            
            // Simple validation
            if (!email || !password) {
                showAlert('Please enter both email and password', 'error');
                return;
            }
            
            // Find user
            var user = DigitalLibrary.getUserByEmail(email);
            
            if (!user) {
                showAlert('User not found. Please sign up first.', 'error');
                return;
            }
            
            if (user.password !== password) {
                showAlert('Incorrect password', 'error');
                return;
            }
            
            // Login successful
            currentUser = {
                isLoggedIn: true,
                name: user.name,
                email: user.email,
                id: user.id,
                subscription: user.subscription,
                likedBooks: user.likedBooks || []
            };
            
            // Save to localStorage
            localStorage.setItem('currentUser', JSON.stringify({
                email: user.email,
                name: user.name
            }));
            
            closeModal('loginModal');
            showAlert('Welcome back, ' + user.name + '!', 'success');
            
            // Update UI
            updateNavigation();
            updateUserPanel();
            
            // Reload current page
            loadPageContent(currentPage);
        }

        function handleSignup(event) {
            event.preventDefault();
            
            var name = document.getElementById('signupName').value.trim();
            var email = document.getElementById('signupEmail').value.trim();
            var password = document.getElementById('signupPassword').value;
            
            // Simple validation
            if (!name || !email || !password) {
                showAlert('Please fill all fields', 'error');
                return;
            }
            
            // Check if user already exists
            var existingUser = DigitalLibrary.getUserByEmail(email);
            if (existingUser) {
                showAlert('User already exists. Please login.', 'error');
                openLoginModal();
                return;
            }
            
            // Create new user
            var user = {
                name: name,
                email: email,
                password: password,
                role: 'user',
                subscription: 'free',
                likedBooks: []
            };
            
            DigitalLibrary.saveUser(user);
            
            // Auto-login
            currentUser = {
                isLoggedIn: true,
                name: user.name,
                email: user.email,
                id: user.id,
                subscription: user.subscription,
                likedBooks: user.likedBooks || []
            };
            
            // Save to localStorage
            localStorage.setItem('currentUser', JSON.stringify({
                email: user.email,
                name: user.name
            }));
            
            closeModal('signupModal');
            showAlert('🎉 Welcome to Electro-LASS, ' + name + '!', 'success');
            
            // Update UI
            updateNavigation();
            updateUserPanel();
            
            // Navigate to library
            navigateTo('library');
        }

        function logout() {
            if (confirm('Are you sure you want to logout?')) {
                currentUser = {
                    isLoggedIn: false,
                    name: "",
                    email: "",
                    id: "",
                    subscription: "free",
                    likedBooks: []
                };
                
                localStorage.removeItem('currentUser');
                
                updateNavigation();
                updateUserPanel();
                
                navigateTo('home');
                
                showAlert('Logged out successfully', 'info');
            }
        }

        function showLoginRequired() {
            showAlert('Please login to access this feature', 'warning');
            openLoginModal();
        }

        // ===== UTILITY FUNCTIONS =====
        function showAlert(message, type) {
            var alertDiv = document.createElement('div');
            alertDiv.className = 'alert alert-' + type;
            alertDiv.innerHTML = `
                <div style="display: flex; align-items: center; gap: 10px;">
                    <i class="fas fa-${type === 'success' ? 'check-circle' : type === 'error' ? 'exclamation-circle' : 'info-circle'}"></i>
                    <div>${message}</div>
                </div>
            `;
            
            document.body.appendChild(alertDiv);
            
            // Auto-remove after 3 seconds
            setTimeout(function() {
                if (alertDiv.parentNode) {
                    alertDiv.parentNode.removeChild(alertDiv);
                }
            }, 3000);
        }

        // Handle browser back/forward
        window.addEventListener('hashchange', function() {
            var hash = window.location.hash.replace('#', '');
            if (hash) {
                navigateTo(hash);
            }
        });

        // Close modal when clicking outside
        window.addEventListener('click', function(event) {
            var modals = document.querySelectorAll('.modal');
            modals.forEach(function(modal) {
                if (event.target === modal) {
                    modal.style.display = 'none';
                }
            });
        });

        console.log('Electro-LASS Digital Library ready!');
    </script>
</body>
</html>
