<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Suggestions · Electro-LASS</title>
  <!-- Font Awesome for icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <!-- Firebase (compat) -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',sans-serif; }
    body {
      background: #0a0f2e;
      color: #ffffff;
      min-height: 100vh;
      padding: 2rem 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .container {
      max-width: 700px;
      width: 100%;
    }
    h1 {
      font-size: 2.5rem;
      margin-bottom: 0.5rem;
      background: linear-gradient(45deg, #ff7200, #00ffcc);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .subtitle {
      color: #aaaaaa;
      margin-bottom: 2rem;
    }
    .form-card {
      background: rgba(10,15,46,0.7);
      padding: 2rem;
      border-radius: 12px;
      border: 1px solid rgba(0,255,204,0.3);
      margin-bottom: 2rem;
    }
    .form-group {
      margin-bottom: 1.5rem;
    }
    .form-group label {
      display: block;
      font-weight: 600;
      margin-bottom: 0.5rem;
      color: #fff;
    }
    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: 12px 15px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(0,255,204,0.3);
      border-radius: 8px;
      color: #fff;
      font-size: 1rem;
      transition: 0.3s;
    }
    .form-group input:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: #00ffcc;
      box-shadow: 0 0 0 2px rgba(0,255,204,0.2);
    }
    .form-group textarea {
      resize: vertical;
      min-height: 100px;
    }
    .btn {
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      transition: 0.3s;
      background: linear-gradient(135deg, #ff7200, #9d00ff);
      color: white;
      width: 100%;
      justify-content: center;
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
    }
    .suggestion-list {
      margin-top: 2rem;
      max-height: 500px;
      overflow-y: auto;
      padding-right: 5px;
    }
    .suggestion-list::-webkit-scrollbar {
      width: 6px;
    }
    .suggestion-list::-webkit-scrollbar-track {
      background: rgba(255,255,255,0.05);
      border-radius: 10px;
    }
    .suggestion-list::-webkit-scrollbar-thumb {
      background: #ff7200;
      border-radius: 10px;
    }
    .suggestion-item {
      background: rgba(255,255,255,0.05);
      padding: 1.2rem;
      border-radius: 8px;
      border-left: 4px solid #ff7200;
      margin-bottom: 1rem;
    }
    .suggestion-name {
      font-weight: bold;
      color: #00ffcc;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .suggestion-date {
      font-size: 0.8rem;
      color: #aaaaaa;
      margin-top: 4px;
    }
    .suggestion-text {
      margin-top: 8px;
      color: #e0e0e0;
      line-height: 1.5;
    }
    .empty-state {
      text-align: center;
      color: #aaaaaa;
      padding: 2rem 0;
    }
    .empty-state i {
      font-size: 3rem;
      color: #ff7200;
      opacity: 0.5;
      margin-bottom: 1rem;
      display: block;
    }
    .comment-link {
      display: inline-block;
      margin-top: 1rem;
      color: #ff7200;
      text-decoration: none;
      font-weight: 600;
    }
    .comment-link i {
      margin-right: 6px;
    }
    .alert {
      padding: 0.8rem 1rem;
      border-radius: 8px;
      margin-bottom: 1rem;
      display: none;
    }
    .alert.show { display: block; }
    .alert.success { background: rgba(0,255,136,0.15); border:1px solid #00ff88; color:#00ff88; }
    .alert.error { background: rgba(255,56,96,0.15); border:1px solid #ff3860; color:#ff3860; }
    .alert.warning { background: rgba(255,193,7,0.15); border:1px solid #ffc107; color:#ffc107; }
    .loading {
      text-align: center;
      color: #00ffcc;
      padding: 1rem;
    }
    .loading i {
      margin-right: 8px;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (max-width: 600px) {
      h1 { font-size: 2rem; }
      .form-card { padding: 1.5rem; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1><i class="fas fa-comment-dots"></i> Suggestions</h1>
    <p class="subtitle">Share your ideas to help us improve the library.</p>

    <!-- Alert messages -->
    <div id="alert" class="alert"></div>

    <!-- Submission Form -->
    <div class="form-card">
      <form id="suggestionForm">
        <div class="form-group">
          <label for="suggestionName"><i class="fas fa-user"></i> Your Name</label>
          <input type="text" id="suggestionName" placeholder="Enter your name" required />
        </div>
        <div class="form-group">
          <label for="suggestionComment"><i class="fas fa-pen"></i> Your Suggestion</label>
          <textarea id="suggestionComment" placeholder="What would you like to see?" required></textarea>
        </div>
        <button type="submit" class="btn"><i class="fas fa-paper-plane"></i> Submit Suggestion</button>
      </form>
    </div>

    <!-- Link to comments -->
    <a href="#suggestionsList" class="comment-link"><i class="fas fa-link"></i> #comment – jump to all suggestions</a>

    <!-- Suggestions List -->
    <div id="suggestionsList" style="margin-top: 2rem;">
      <h2 style="color: #00ffcc; margin-bottom: 1rem; display: flex; align-items: center; gap: 10px;">
        <i class="fas fa-list"></i> All Suggestions
      </h2>
      <div id="suggestionsContainer" class="suggestion-list">
        <div class="loading"><i class="fas fa-spinner"></i> Loading suggestions...</div>
      </div>
    </div>
  </div>

  <script>
    // Firebase config (same as your main app)
    var firebaseConfig = {
      apiKey: "AIzaSyDedupt8sEx-fyv57NPEhkpCnR74miLoS0",
      authDomain: "electro-lass.firebaseapp.com",
      projectId: "electro-lass",
      storageBucket: "electro-lass.firebasestorage.app",
      messagingSenderId: "50993129751",
      appId: "1:50993129751:web:f6f15090d866d76dff6f52",
      measurementId: "G-BYSYN6YVW1"
    };

    firebase.initializeApp(firebaseConfig);
    var db = firebase.firestore();

    // Enable offline persistence (optional)
    db.enablePersistence().catch(function(err) { console.warn('Persistence:', err); });

    // DOM refs
    var form = document.getElementById('suggestionForm');
    var nameInput = document.getElementById('suggestionName');
    var commentInput = document.getElementById('suggestionComment');
    var container = document.getElementById('suggestionsContainer');
    var alertBox = document.getElementById('alert');

    // Helper: show alert
    function showAlert(message, type) {
      alertBox.textContent = message;
      alertBox.className = 'alert show ' + type;
      setTimeout(function() { alertBox.className = 'alert'; }, 5000);
    }

    // Submit suggestion
    form.addEventListener('submit', function(e) {
      e.preventDefault();
      var name = nameInput.value.trim();
      var comment = commentInput.value.trim();
      if (!name || !comment) {
        showAlert('Please fill in both fields.', 'warning');
        return;
      }
      // Disable button to prevent double submit
      var btn = form.querySelector('button[type="submit"]');
      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Submitting...';

      db.collection('suggestions').add({
        name: name,
        comment: comment,
        timestamp: new Date().toISOString()
      }).then(function() {
        form.reset();
        showAlert('✅ Thank you for your suggestion!', 'success');
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-paper-plane"></i> Submit Suggestion';
      }).catch(function(err) {
        showAlert('Error: ' + err.message, 'error');
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-paper-plane"></i> Submit Suggestion';
      });
    });

    // Load and listen for real‑time updates
    function loadSuggestions() {
      container.innerHTML = '<div class="loading"><i class="fas fa-spinner"></i> Loading suggestions...</div>';

      db.collection('suggestions')
        .orderBy('timestamp', 'desc')
        .onSnapshot(function(snapshot) {
          if (snapshot.empty) {
            container.innerHTML = `
              <div class="empty-state">
                <i class="fas fa-comment-slash"></i>
                <p>No suggestions yet. Be the first to share!</p>
              </div>
            `;
            return;
          }
          var html = '';
          snapshot.forEach(function(doc) {
            var data = doc.data();
            var date = data.timestamp ? new Date(data.timestamp).toLocaleString('en-US', {
              month: 'short', day: 'numeric', year: 'numeric',
              hour: '2-digit', minute: '2-digit'
            }) : 'Just now';
            html += `
              <div class="suggestion-item">
                <div class="suggestion-name"><i class="fas fa-user-circle"></i> ${data.name}</div>
                <div class="suggestion-date"><i class="fas fa-clock"></i> ${date}</div>
                <div class="suggestion-text">${data.comment}</div>
              </div>
            `;
          });
          container.innerHTML = html;

          // If URL has #comment, scroll to the list
          if (window.location.hash === '#suggestionsList') {
            document.getElementById('suggestionsList').scrollIntoView({ behavior: 'smooth' });
          }
        }, function(err) {
          container.innerHTML = '<p style="color:var(--text-gray);">Could not load suggestions. Please refresh.</p>';
          console.warn('Listener error:', err);
        });
    }

    // Initial load
    loadSuggestions();

    // Handle #comment anchor after page load
    window.addEventListener('hashchange', function() {
      if (window.location.hash === '#suggestionsList') {
        document.getElementById('suggestionsList').scrollIntoView({ behavior: 'smooth' });
      }
    });
  </script>
</body>
</html>
