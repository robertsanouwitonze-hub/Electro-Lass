<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Suggestions · Electro-LASS</title>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <!-- Firebase (compat) – app + firestore + auth -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js">
    </script>
    <style>
        /* ─── Reset & Base ─── */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }
        body {
            background: #0a0f2e;
            color: #ffffff;
            min-height: 100vh;
            padding: 2rem 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 700px;
            width: 100%;
        }

        /* ─── Typography ─── */
        h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            background: linear-gradient(45deg, #ff7200, #00ffcc);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .subtitle {
            color: #aaaaaa;
            margin-bottom: 2rem;
        }

        /* ─── Cards ─── */
        .form-card {
            background: rgba(10, 15, 46, 0.7);
            padding: 2rem;
            border-radius: 12px;
            border: 1px solid rgba(0, 255, 204, 0.3);
            margin-bottom: 2rem;
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: #fff;
        }
        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px 15px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(0, 255, 204, 0.3);
            border-radius: 8px;
            color: #fff;
            font-size: 1rem;
            transition: 0.3s;
        }
        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #00ffcc;
            box-shadow: 0 0 0 2px rgba(0, 255, 204, 0.2);
        }
        .form-group textarea {
            resize: vertical;
            min-height: 100px;
        }

        /* ─── Buttons ─── */
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            transition: 0.3s;
            background: linear-gradient(135deg, #ff7200, #9d00ff);
            color: white;
            width: 100%;
            justify-content: center;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .btn-outline {
            background: transparent;
            border: 1px solid #ff7200;
            color: #ff7200;
            width: auto;
        }
        .btn-outline:hover {
            background: rgba(255, 114, 0, 0.15);
            transform: none;
            box-shadow: none;
        }

        /* ─── Auth State ─── */
        .auth-notice {
            background: rgba(255, 193, 7, 0.12);
            border: 1px solid #ffc107;
            border-radius: 8px;
            padding: 1.5rem;
            text-align: center;
            margin-bottom: 1.5rem;
        }
        .auth-notice i {
            font-size: 2rem;
            color: #ffc107;
            display: block;
            margin-bottom: 0.75rem;
        }
        .auth-notice p {
            color: #ffc107;
            font-size: 1.1rem;
        }
        .auth-notice .btn-outline {
            margin-top: 1rem;
        }

        /* ─── Suggestion List ─── */
        .suggestion-list {
            margin-top: 2rem;
            max-height: 500px;
            overflow-y: auto;
            padding-right: 5px;
        }
        .suggestion-list::-webkit-scrollbar {
            width: 6px;
        }
        .suggestion-list::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
        }
        .suggestion-list::-webkit-scrollbar-thumb {
            background: #ff7200;
            border-radius: 10px;
        }
        .suggestion-item {
            background: rgba(255, 255, 255, 0.05);
            padding: 1.2rem;
            border-radius: 8px;
            border-left: 4px solid #ff7200;
            margin-bottom: 1rem;
        }
        .suggestion-name {
            font-weight: bold;
            color: #00ffcc;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .suggestion-date {
            font-size: 0.8rem;
            color: #aaaaaa;
            margin-top: 4px;
        }
        .suggestion-text {
            margin-top: 8px;
            color: #e0e0e0;
            line-height: 1.5;
            word-break: break-word;
        }

        /* ─── Empty / Loading ─── */
        .empty-state {
            text-align: center;
            color: #aaaaaa;
            padding: 2rem 0;
        }
        .empty-state i {
            font-size: 3rem;
            color: #ff7200;
            opacity: 0.5;
            margin-bottom: 1rem;
            display: block;
        }
        .loading {
            text-align: center;
            color: #00ffcc;
            padding: 1rem;
        }
        .loading i {
            margin-right: 8px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ─── Alerts ─── */
        .alert {
            padding: 0.8rem 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            display: none;
        }
        .alert.show {
            display: block;
        }
        .alert.success {
            background: rgba(0, 255, 136, 0.15);
            border: 1px solid #00ff88;
            color: #00ff88;
        }
        .alert.error {
            background: rgba(255, 56, 96, 0.15);
            border: 1px solid #ff3860;
            color: #ff3860;
        }
        .alert.warning {
            background: rgba(255, 193, 7, 0.15);
            border: 1px solid #ffc107;
            color: #ffc107;
        }

        /* ─── Misc ─── */
        .comment-link {
            display: inline-block;
            margin-top: 0.5rem;
            color: #ff7200;
            text-decoration: none;
            font-weight: 600;
        }
        .comment-link i {
            margin-right: 6px;
        }
        .section-title {
            color: #00ffcc;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .hidden {
            display: none !important;
        }
        .flex-center {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 2rem;
            }
            .form-card {
                padding: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">

        <!-- ─── HEADER ─── -->
        <h1><i class="fas fa-comment-dots"></i> Suggestions</h1>
        <p class="subtitle">Share your ideas to help us improve the library.</p>

        <!-- ─── ALERT ─── -->
        <div id="alert" class="alert"></div>

        <!-- ─── AUTH NOTICE (hidden by default) ─── -->
        <div id="authNotice" class="auth-notice hidden">
            <i class="fas fa-lock"></i>
            <p>Please log in to view and submit suggestions.</p>
            <button id="loginRedirectBtn" class="btn btn-outline" style="margin-top:0.75rem;">
                <i class="fas fa-sign-in-alt"></i> Login
            </button>
        </div>

        <!-- ─── SUBMISSION FORM (hidden until auth) ─── -->
        <div id="formContainer" class="form-card hidden">
            <form id="suggestionForm">
                <div class="form-group">
                    <label for="suggestionName">
                        <i class="fas fa-user"></i> Your Name
                    </label>
                    <input type="text" id="suggestionName" placeholder="Enter your name" required readonly />
                </div>
                <div class="form-group">
                    <label for="suggestionComment">
                        <i class="fas fa-pen"></i> Your Suggestion
                    </label>
                    <textarea id="suggestionComment" placeholder="What would you like to see?" required></textarea>
                </div>
                <button type="submit" class="btn" id="submitBtn">
                    <i class="fas fa-paper-plane"></i> Submit Suggestion
                </button>
            </form>
        </div>

        <!-- ─── JUMP LINK ─── -->
        <a href="#suggestionsList" class="comment-link"><i class="fas fa-link"></i> #comment – jump to all suggestions</a>

        <!-- ─── SUGGESTIONS LIST ─── -->
        <div id="suggestionsList" style="margin-top: 2rem;">
            <h2 class="section-title"><i class="fas fa-list"></i> All Suggestions</h2>
            <div id="suggestionsContainer" class="suggestion-list">
                <div class="loading"><i class="fas fa-spinner"></i> Loading suggestions…</div>
            </div>
        </div>

    </div>

    <script>
        // ═══════════════════════════════════════════════════════════
        //  FIREBASE CONFIG
        // ═══════════════════════════════════════════════════════════
        var firebaseConfig = {
            apiKey: "AIzaSyDedupt8sEx-fyv57NPEhkpCnR74miLoS0",
            authDomain: "electro-lass.firebaseapp.com",
            projectId: "electro-lass",
            storageBucket: "electro-lass.firebasestorage.app",
            messagingSenderId: "50993129751",
            appId: "1:50993129751:web:f6f15090d866d76dff6f52",
            measurementId: "G-BYSYN6YVW1"
        };

        firebase.initializeApp(firebaseConfig);
        var db = firebase.firestore();
        var auth = firebase.auth();

        // Enable offline persistence (best effort)
        db.enablePersistence().catch(function(err) {
            console.warn('Persistence not enabled:', err);
        });

        // ═══════════════════════════════════════════════════════════
        //  DOM REFS
        // ═══════════════════════════════════════════════════════════
        var form = document.getElementById('suggestionForm');
        var nameInput = document.getElementById('suggestionName');
        var commentInput = document.getElementById('suggestionComment');
        var submitBtn = document.getElementById('submitBtn');
        var container = document.getElementById('suggestionsContainer');
        var alertBox = document.getElementById('alert');
        var authNotice = document.getElementById('authNotice');
        var formContainer = document.getElementById('formContainer');
        var loginBtn = document.getElementById('loginRedirectBtn');

        // ═══════════════════════════════════════════════════════════
        //  STATE
        // ═══════════════════════════════════════════════════════════
        var unsubscribeSuggestions = null; // Firestore listener unsub
        var currentUser = null; // firebase.User or null
        var isAuthReady = false;

        // ═══════════════════════════════════════════════════════════
        //  HELPERS
        // ═══════════════════════════════════════════════════════════

        /** Show a dismissible alert */
        function showAlert(message, type) {
            alertBox.textContent = message;
            alertBox.className = 'alert show ' + (type || 'warning');
            clearTimeout(alertBox._timer);
            alertBox._timer = setTimeout(function() {
                alertBox.className = 'alert';
            }, 6000);
        }

        /** Escape text for safe insertion into HTML (extra layer) */
        function escapeHtml(text) {
            if (!text) return '';
            var div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        /** Format a Firestore Timestamp or Date */
        function formatTimestamp(value) {
            if (!value) return 'Just now';
            var date = value.toDate ? value.toDate() : new Date(value);
            if (isNaN(date.getTime())) return 'Just now';
            return date.toLocaleString('en-US', {
                month: 'short',
                day: 'numeric',
                year: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        /** Build a suggestion DOM element safely (no innerHTML with user data) */
        function createSuggestionElement(data) {
            var div = document.createElement('div');
            div.className = 'suggestion-item';

            // Name
            var nameDiv = document.createElement('div');
            nameDiv.className = 'suggestion-name';
            var nameIcon = document.createElement('i');
            nameIcon.className = 'fas fa-user-circle';
            nameDiv.appendChild(nameIcon);
            var nameSpan = document.createElement('span');
            nameSpan.textContent = data.name || 'Anonymous';
            nameDiv.appendChild(nameSpan);
            div.appendChild(nameDiv);

            // Date
            var dateDiv = document.createElement('div');
            dateDiv.className = 'suggestion-date';
            var dateIcon = document.createElement('i');
            dateIcon.className = 'fas fa-clock';
            dateDiv.appendChild(dateIcon);
            var dateSpan = document.createElement('span');
            dateSpan.textContent = formatTimestamp(data.timestamp);
            dateDiv.appendChild(dateSpan);
            div.appendChild(dateDiv);

            // Comment
            var textDiv = document.createElement('div');
            textDiv.className = 'suggestion-text';
            textDiv.textContent = data.comment || '';
            div.appendChild(textDiv);

            return div;
        }

        // ═══════════════════════════════════════════════════════════
        //  SUGGESTIONS LISTENER (auth‑guarded)
        // ═══════════════════════════════════════════════════════════

        function startSuggestionsListener() {
            // Clean up any existing listener
            if (unsubscribeSuggestions) {
                unsubscribeSuggestions();
                unsubscribeSuggestions = null;
            }

            // Show loading
            container.innerHTML = '<div class="loading"><i class="fas fa-spinner"></i> Loading suggestions…</div>';

            // Only start if we have a user
            if (!currentUser) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-lock"></i>
                        <p>Please log in to view suggestions.</p>
                    </div>
                `;
                return;
            }

            // Start listening
            unsubscribeSuggestions = db.collection('suggestions')
                .orderBy('timestamp', 'desc')
                .onSnapshot(function(snapshot) {
                    if (snapshot.empty) {
                        container.innerHTML = `
                            <div class="empty-state">
                                <i class="fas fa-comment-slash"></i>
                                <p>No suggestions yet. Be the first to share!</p>
                            </div>
                        `;
                        return;
                    }

                    var fragment = document.createDocumentFragment();
                    snapshot.forEach(function(doc) {
                        var data = doc.data();
                        var el = createSuggestionElement(data);
                        fragment.appendChild(el);
                    });

                    container.innerHTML = '';
                    container.appendChild(fragment);

                    // If URL hash points to list, scroll smoothly
                    if (window.location.hash === '#suggestionsList') {
                        document.getElementById('suggestionsList').scrollIntoView({ behavior: 'smooth' });
                    }
                }, function(err) {
                    console.error('Listener error:', err);
                    if (err.code === 'permission-denied') {
                        container.innerHTML = `
                            <div class="empty-state">
                                <i class="fas fa-lock"></i>
                                <p>Permission denied. Please log in to view suggestions.</p>
                            </div>
                        `;
                    } else {
                        container.innerHTML = `
                            <div class="empty-state">
                                <i class="fas fa-exclamation-triangle"></i>
                                <p>Could not load suggestions. Please refresh.</p>
                                <p style="font-size:0.8rem;color:#ff3860;">${escapeHtml(err.message)}</p>
                            </div>
                        `;
                    }
                });
        }

        // ═══════════════════════════════════════════════════════════
        //  AUTH STATE HANDLER
        // ═══════════════════════════════════════════════════════════

        auth.onAuthStateChanged(function(user) {
            currentUser = user;
            isAuthReady = true;

            // Clean up old listener
            if (unsubscribeSuggestions) {
                unsubscribeSuggestions();
                unsubscribeSuggestions = null;
            }

            if (user) {
                // ─── LOGGED IN ───
                // Show form, hide notice
                authNotice.classList.add('hidden');
                formContainer.classList.remove('hidden');

                // Fill name from auth
                var displayName = user.displayName || user.email || 'User';
                nameInput.value = displayName;
                nameInput.readOnly = true;

                // Enable submit
                submitBtn.disabled = false;

                // Start listener
                startSuggestionsListener();

                console.log('✅ Authenticated as:', user.email);

            } else {
                // ─── LOGGED OUT ───
                authNotice.classList.remove('hidden');
                formContainer.classList.add('hidden');

                // Show login message in list
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-lock"></i>
                        <p>Please log in to view and submit suggestions.</p>
                    </div>
                `;

                // Disable submit
                submitBtn.disabled = true;

                console.log('🔒 Not authenticated – suggestions locked');
            }
        });

        // ═══════════════════════════════════════════════════════════
        //  LOGIN REDIRECT
        // ═══════════════════════════════════════════════════════════

        loginBtn.addEventListener('click', function() {
            // Attempt to redirect to login page – adjust URL as needed
            // If your login is on the same page, use a different flow.
            // For now, we try to redirect to the main page's login.
            var loginUrl = '/' + (window.location.pathname.includes('suggestions') ? '..' : '') +
                '/?login=true#login';
            window.location.href = loginUrl;
        });

        // ═══════════════════════════════════════════════════════════
        //  SUBMIT SUGGESTION
        // ═══════════════════════════════════════════════════════════

        form.addEventListener('submit', function(e) {
            e.preventDefault();

            // Double-check auth
            if (!currentUser) {
                showAlert('You must be logged in to submit.', 'warning');
                return;
            }

            var comment = commentInput.value.trim();
            if (!comment) {
                showAlert('Please enter a suggestion.', 'warning');
                return;
            }

            if (comment.length > 5000) {
                showAlert('Suggestion is too long (max 5000 characters).', 'warning');
                return;
            }

            // Disable button
            submitBtn.disabled = true;
            var originalHtml = submitBtn.innerHTML;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Submitting…';

            var name = currentUser.displayName || currentUser.email || 'User';

            db.collection('suggestions').add({
                userId: currentUser.uid,
                name: name,
                email: currentUser.email || '',
                comment: comment,
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            }).then(function() {
                showAlert('✅ Thank you for your suggestion!', 'success');
                commentInput.value = '';
                submitBtn.disabled = false;
                submitBtn.innerHTML = originalHtml;
            }).catch(function(err) {
                console.error('Submit error:', err);
                var msg = err.message;
                if (err.code === 'permission-denied') {
                    msg = 'Permission denied. Please make sure you are logged in.';
                }
                showAlert('Error: ' + msg, 'error');
                submitBtn.disabled = false;
                submitBtn.innerHTML = originalHtml;
            });
        });

        // ═══════════════════════════════════════════════════════════
        //  HASH CHANGE SCROLL
        // ═══════════════════════════════════════════════════════════

        window.addEventListener('hashchange', function() {
            if (window.location.hash === '#suggestionsList') {
                document.getElementById('suggestionsList').scrollIntoView({ behavior: 'smooth' });
            }
        });

        // ═══════════════════════════════════════════════════════════
        //  INITIAL LOAD – wait for auth via onAuthStateChanged
        // ═══════════════════════════════════════════════════════════
        //  Nothing else needed – onAuthStateChanged triggers everything.
        //  If auth is already resolved, it will fire immediately.

        console.log('🔐 Suggestions page ready – waiting for auth…');
    </script>
</body>
</html>
